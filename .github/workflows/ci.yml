name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the running check
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build

      - run: dotnet tool restore
      - name: Check the EF model has no changes without a migration
        run: dotnet dotnet-ef migrations has-pending-model-changes --project DotaDraft.Api --no-build
        env:
          # EF needs a connection string to build the model, but never connects
          ConnectionStrings__DefaultConnection: Host=localhost;Database=unused

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DotaDraft.Web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: DotaDraft.Web/package-lock.json

      - run: npm ci
      - run: npm test -- --watch=false
      - run: npx ng build
