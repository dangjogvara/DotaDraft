services:
  postgres:
    image: postgres:17-alpine
    container_name: dota_postgres
    environment:
      POSTGRES_DB: dotadraft
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: