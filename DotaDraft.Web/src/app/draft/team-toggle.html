<div class="mb-3 flex items-center gap-2" role="group" aria-labelledby="team-toggle-label">
  <span id="team-toggle-label" class="text-sm text-slate-400">Add picks to</span>
  @for (option of options; track option.value) {
    @let selected = team() === option.value;
    <button
      type="button"
      class="rounded px-3 py-1 text-sm transition"
      [class]="selected ? option.selectedClass : 'bg-slate-800 text-slate-300 hover:bg-slate-700'"
      [attr.aria-pressed]="selected"
      (click)="team.set(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
