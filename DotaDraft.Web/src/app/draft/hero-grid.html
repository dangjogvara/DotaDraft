<ul class="grid grid-cols-[repeat(auto-fill,minmax(6rem,1fr))] gap-2">
  @for (hero of heroes(); track hero.id) {
    @let team = enemyIds().has(hero.id) ? 'enemy' : allyIds().has(hero.id) ? 'ally' : null;
    @let picked = team !== null;
    <li>
      <button
        type="button"
        class="group relative w-full overflow-hidden rounded-md bg-slate-800 ring-2 ring-transparent transition enabled:hover:-translate-y-0.5 enabled:hover:bg-slate-700 enabled:hover:shadow-lg enabled:hover:shadow-black/40 enabled:hover:ring-sky-400/80 focus-visible:ring-sky-400 focus-visible:outline-none disabled:cursor-not-allowed"
        [class.opacity-40]="picked || full()"
        [disabled]="picked || full()"
        [attr.title]="picked ? hero.localizedName + ' is already picked' : full() ? 'That team is full' : null"
        (click)="heroSelected.emit(hero)"
      >
        @if (hero.imgUrl) {
          <img [src]="hero.imgUrl" alt="" class="aspect-video w-full object-cover transition group-enabled:group-hover:brightness-110" loading="lazy" />
        } @else {
          <div class="aspect-video w-full bg-slate-700"></div>
        }
        <span class="block truncate px-1 py-0.5 text-xs text-slate-300 group-enabled:group-hover:text-white">
          {{ hero.localizedName }}
        </span>
        @if (team) {
          <span
            class="absolute top-1 left-1 rounded px-1 text-[10px] font-semibold text-white uppercase"
            [class]="team === 'enemy' ? 'bg-red-600' : 'bg-emerald-600'"
          >
            {{ team === 'enemy' ? 'Enemy' : 'Ally' }}
          </span>
        }
      </button>
    </li>
  }
</ul>
